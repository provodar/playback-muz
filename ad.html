<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приєднуйся до Плейбеку</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: #000;
        }

        /* Контейнер для 3-х горизонтальних шарів */
        .ad-poster {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100vh;
            position: relative;
            cursor: pointer;
            overflow: hidden;
        }

        .bg-strip {
            flex: 1;
            background-size: cover;
            background-position: center;
            width: 100%;
            transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        /* Легкий зум при наведенні */
        .ad-poster:hover .bg-strip {
            transform: scale(1.04);
        }

        /* Оверлей з текстом */
        .text-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            pointer-events: none;
        }

        h1 {
            color: #fff;
            font-size: 6vw; /* Трохи зменшено, бо тепер 4 рядки */
            text-align: center;
            text-transform: uppercase;
            line-height: 1.8; /* Подвійний інтервал як і раніше */
            margin: 0;
            padding: 20px;
            max-width: 95%;
            /* Потужна тінь для читабельності на світлому фоні */
            text-shadow: 0 4px 15px rgba(0,0,0,0.8), 0 0 30px rgba(0,0,0,0.4);
            letter-spacing: -2px;
        }

        .line {
            display: block;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 9.5vw;
                letter-spacing: -1px;
                line-height: 2.1;
            }
        }
    </style>
</head>
<body>

    <div class="ad-poster" onclick="window.location.href='index.html';">
        <div class="bg-strip" id="strip-1"></div>
        <div class="bg-strip" id="strip-2"></div>
        <div class="bg-strip" id="strip-3"></div>

        <div class="text-overlay">
            <h1>
                <span class="line">бери інструмент</span>
                <span class="line">імпровізувати</span>
                <span class="line">до нас в студію</span>
                <span class="line">плейбек-театру</span>
            </h1>
        </div>
    </div>

    <script>
        fetch('data.json')
            .then(response => response.json())
            .then(data => {
                if(data.hero && data.hero.images) {
                    document.getElementById('strip-1').style.backgroundImage = `url('${data.hero.images[0]}')`;
                    document.getElementById('strip-2').style.backgroundImage = `url('${data.hero.images[1]}')`;
                    document.getElementById('strip-3').style.backgroundImage = `url('${data.hero.images[2]}')`;
                }
            })
            .catch(err => console.error('Помилка завантаження даних:', err));
    </script>
</body>
</html>
