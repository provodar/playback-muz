<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Набір | Плейбек-театр Портрет</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-color: #1a1a1a;
            --accent-color: #2b6cb0;
            --accent-hover: #1a4a7b;
        }

        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100%;
            overflow: hidden;
        }

        .snap-container {
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
        }

        .screen {
            height: 100vh;
            width: 100vw;
            scroll-snap-align: start;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
        }

        .content-wrapper {
            display: flex;
            max-width: 1200px;
            width: 100%;
            height: 85vh;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            margin-right: 60px;
        }

        .text-side { flex: 1; padding: 60px; display: flex; flex-direction: column; justify-content: center; }
        .image-side { flex: 1; background-size: cover; background-position: center; }

        #hero-img-collage {
            display: flex;
            flex-direction: column;
            flex: 1; 
            height: 100%;
            width: 100%;
        }

        .hero-image-item {
            flex: 1;
            width: 100%;
            background-size: cover;
            background-position: center;
        }

        .nav-arrow {
            position: absolute;
            right: 40px;
            width: 70px;
            height: 70px;
            background-color: var(--accent-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 8px 16px rgba(43, 108, 176, 0.3);
            border: none;
            z-index: 50;
            transition: all 0.3s ease;
        }

        .nav-arrow:hover {
            background-color: var(--accent-hover);
            transform: scale(1.1);
        }

        .nav-arrow svg {
            fill: white;
            width: 40px;
            height: 40px;
        }

        .arrow-up { top: 40px; }
        .arrow-down { bottom: 40px; }

        h1 { font-size: 3.5rem; font-weight: 800; line-height: 1.1; margin-bottom: 20px; letter-spacing: -1px; }
        h2 { font-size: 2.5rem; font-weight: 800; margin-bottom: 30px; letter-spacing: -0.5px; }
        p { font-size: 1.25rem; line-height: 1.6; color: #4a5568; margin-bottom: 30px; }
        ul { padding-left: 20px; }
        li { font-size: 1.2rem; line-height: 1.6; margin-bottom: 20px; color: #4a5568; }

        .btn {
            display: inline-block;
            background-color: var(--accent-color);
            color: white;
            padding: 18px 40px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            align-self: flex-start;
        }

        form { display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 400px; }
        input, textarea { padding: 16px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 1.1rem; font-family: inherit; resize: none; }
        .form-status { display: none; padding: 15px; border-radius: 12px; background: #c6f6d5; color: #22543d; font-weight: 600; margin-top: 20px; }

        @media (max-width: 900px) {
        .snap-container {
            scroll-snap-type: none;
            height: auto;
        }
        
        .screen {
            height: auto;
            min-height: 100vh;
            padding: 60px 20px; /* Запас для навігаційних стрілок */
        }

        .content-wrapper { 
            flex-direction: column; 
            height: auto; 
            margin-right: 0; 
        }
        
        /* Контентний розподіл: спочатку текст, потім фото */
        .text-side { 
            order: 1;
            padding: 30px 20px; 
        }
        
        .image-side, #hero-img-collage { 
            order: 2;
            display: flex;
            height: 250px; /* Оптимальна висота для фото на мобільних */
            width: 100%;
        }

        /* ХОВАЄМО фото ТІЛЬКИ на екрані з формою */
        #screen-form #form-img {
            display: none;
        }
        
        /* Компактизація типографіки та форми */
        h1 { font-size: 2.2rem; }
        h2 { font-size: 1.8rem; margin-bottom: 15px; }
        p { font-size: 1rem; margin-bottom: 15px; }
        ul { padding-left: 15px; }
        li { font-size: 1rem; line-height: 1.4; margin-bottom: 10px; }
        
        form { gap: 10px; max-width: 100%; }
        input, textarea { padding: 12px; font-size: 1rem; }
        
        /* Адаптація стрілок під тач-інтерфейс */
        .nav-arrow { 
            width: 45px; 
            height: 45px; 
            right: 10px; 
        }
        .nav-arrow svg { width: 25px; height: 25px; }
        .arrow-up { top: 10px; }
        .arrow-down { bottom: 10px; }
    }
    </style>
    <script>
        !function(f,b,e,v,n,t,s)
        {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};
        if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
        n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t,s)}(window, document,'script',
        'https://connect.facebook.net/en_US/fbevents.js');
        fbq('init', '998161555943837');
        fbq('track', 'PageView');
    </script>
    <noscript><img height="1" width="1" style="display:none"
        src="https://www.facebook.com/tr?id=998161555943837&ev=PageView&noscript=1"
    /></noscript>
    </head>
<body>

    <div class="snap-container" id="main-container">
        
        <section class="screen" id="scr-1">
            <div class="content-wrapper">
                <div class="text-side">
                    <h1 id="hero-title"></h1>
                    <p id="hero-subtitle"></p>
                    <button class="btn" onclick="scrollToId('scr-2')" id="hero-button"></button>
                </div>
                <div id="hero-img-collage">
                    <div class="hero-image-item" id="hero-img-1"></div>
                    <div class="hero-image-item" id="hero-img-2"></div>
                    <div class="hero-image-item" id="hero-img-3"></div>
                </div>
            </div>
            <button class="nav-arrow arrow-down" onclick="scrollToId('scr-2')">
                <svg viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
            </button>
        </section>

        <section class="screen" id="scr-2">
            <div class="content-wrapper">
                <div class="image-side" id="filter-img"></div>
                <div class="text-side">
                    <h2 id="filter-title"></h2>
                    <ul id="filter-items"></ul>
                </div>
            </div>
            <button class="nav-arrow arrow-up" onclick="scrollToId('scr-1')">
                <svg viewBox="0 0 24 24"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg>
            </button>
            <button class="nav-arrow arrow-down" onclick="scrollToId('scr-3')">
                <svg viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
            </button>
        </section>

        <section class="screen" id="scr-3">
            <div class="content-wrapper">
                <div class="text-side">
                    <h2 id="about-title"></h2>
                    <p id="about-desc"></p>
                </div>
                <div class="image-side" id="about-img"></div>
            </div>
            <button class="nav-arrow arrow-up" onclick="scrollToId('scr-2')">
                <svg viewBox="0 0 24 24"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg>
            </button>
            <button class="nav-arrow arrow-down" onclick="scrollToId('scr-4')">
                <svg viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
            </button>
        </section>

        <section class="screen" id="scr-4">
            <div class="content-wrapper">
                <div class="image-side" id="benefits-img"></div>
                <div class="text-side">
                    <h2 id="benefits-title"></h2>
                    <ul id="benefits-items"></ul>
                </div>
            </div>
            <button class="nav-arrow arrow-up" onclick="scrollToId('scr-3')">
                <svg viewBox="0 0 24 24"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg>
            </button>
            <button class="nav-arrow arrow-down" onclick="scrollToId('scr-5')">
                <svg viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
            </button>
        </section>

        <section class="screen" id="scr-5">
            <div class="content-wrapper">
                <div class="text-side">
                    <h2 id="stage-title"></h2>
                    <p id="stage-desc"></p>
                </div>
                <div class="image-side" id="stage-img"></div>
            </div>
            <button class="nav-arrow arrow-up" onclick="scrollToId('scr-4')">
                <svg viewBox="0 0 24 24"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg>
            </button>
            <button class="nav-arrow arrow-down" onclick="scrollToId('screen-form')">
                <svg viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
            </button>
        </section>

        <section class="screen" id="screen-form">
            <div class="content-wrapper">
                <div class="text-side">
                    <h2 id="conditions-title"></h2>
                    <ul id="conditions-items" style="margin-bottom: 20px;"></ul>
                    <form id="tg-form">
                        <input type="text" id="input-name" required>
                        <input type="text" id="input-contact" required>
                        <input type="text" id="input-instrument" required>
                        <textarea id="input-about" rows="3" required></textarea>
                        <button type="submit" class="btn" id="submit-btn" style="align-self: stretch;"></button>
                    </form>
                    <div class="form-status" id="form-status">Заявка відправлена!</div>
                </div>
                <div class="image-side" id="form-img"></div>
            </div>
            <button class="nav-arrow arrow-up" onclick="scrollToId('scr-5')">
                <svg viewBox="0 0 24 24"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg>
            </button>
        </section>

    </div>

    <script>
        function scrollToId(id) {
            document.getElementById(id).scrollIntoView({ behavior: 'smooth' });
        }

        fetch('data.json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('hero-title').textContent = data.hero.title;
                document.getElementById('hero-subtitle').textContent = data.hero.subtitle;
                document.getElementById('hero-button').textContent = data.hero.button;
                
                document.getElementById('hero-img-1').style.backgroundImage = `url('${data.hero.images[0]}')`;
                document.getElementById('hero-img-2').style.backgroundImage = `url('${data.hero.images[1]}')`;
                document.getElementById('hero-img-3').style.backgroundImage = `url('${data.hero.images[2]}')`;

                document.getElementById('filter-title').textContent = data.filter.title;
                document.getElementById('filter-img').style.backgroundImage = `url('${data.filter.image}')`;
                data.filter.items.forEach(item => {
                    let li = document.createElement('li'); li.textContent = item;
                    document.getElementById('filter-items').appendChild(li);
                });

                document.getElementById('about-title').textContent = data.about.title;
                document.getElementById('about-desc').textContent = data.about.description;
                document.getElementById('about-img').style.backgroundImage = `url('${data.about.image}')`;

                document.getElementById('benefits-title').textContent = data.benefits.title;
                document.getElementById('benefits-img').style.backgroundImage = `url('${data.benefits.image}')`;
                data.benefits.items.forEach(item => {
                    let li = document.createElement('li'); li.textContent = item;
                    document.getElementById('benefits-items').appendChild(li);
                });

                document.getElementById('stage-title').textContent = data.stage.title;
                document.getElementById('stage-desc').textContent = data.stage.description;
                document.getElementById('stage-img').style.backgroundImage = `url('${data.stage.image}')`;

                document.getElementById('conditions-title').textContent = data.conditions.title;
                document.getElementById('form-img').style.backgroundImage = `url('${data.form.image}')`;
                data.conditions.items.forEach(item => {
                    let li = document.createElement('li'); li.textContent = item;
                    document.getElementById('conditions-items').appendChild(li);
                });

                document.getElementById('input-name').placeholder = data.form.namePlaceholder;
                document.getElementById('input-contact').placeholder = data.form.contactPlaceholder;
                document.getElementById('input-instrument').placeholder = data.form.instrumentPlaceholder;
                document.getElementById('input-about').placeholder = data.form.aboutPlaceholder || 'Кілька слів про себе і про досвід з музичними інструментами';
                document.getElementById('submit-btn').textContent = data.form.submitButton;
            });

        document.getElementById('tg-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submit-btn');
            const originalText = btn.innerText;
            btn.innerText = 'Відправка...';
            btn.disabled = true;

            const contactValue = document.getElementById('input-contact').value;

            const payload = {
                name: document.getElementById('input-name').value,
                phone: contactValue, 
                telegram: contactValue,
                about: document.getElementById('input-about').value,
                interest: document.getElementById('input-instrument').value,
                sourceUrl: window.location.href,
                referrer: document.referrer || 'Прямий захід',
                screenRes: `${window.screen.width}x${window.screen.height}`,
                lang: navigator.language || 'Невизначено',
                fbclid: new URLSearchParams(window.location.search).get('fbclid')
            };

            try {
                const response = await fetch('https://kokosova.com/fb/zrub-webhook.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    if (typeof fbq === 'function') {
                        fbq('track', 'Lead');
                    }
                    document.getElementById('tg-form').style.display = 'none';
                    document.getElementById('form-status').style.display = 'block';
                } else {
                    alert('Помилка відправки. Будь ласка, спробуйте ще раз.');
                    btn.innerText = originalText;
                    btn.disabled = false;
                }
            } catch (error) {
                alert('Помилка з\'єднання. Перевірте інтернет.');
                btn.innerText = originalText;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
